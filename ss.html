<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SLIDE SHOW</title>
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
</head>
<body style="background-color: black;">
	<div class="w3-content w3-section" style="width:500px;">
		<img   class="mySlides w3-animate-left" src="images/ss_a.jpg" style="width:100%;background-image: url('images/regist.jpeg');">
		<img class="mySlides w3-animate-right"src="images/ss_b.jpeg"style="width:100%">
		<img class="mySlides w3-animate-fading"src="images/ss_c.jpeg"style="width:100%">
		<img class="mySlides w3-animate-fading"src="images/ss_d.jpeg"style="width:100%">
	</div>
<script type="text/javascript">
	var a=0;
	carousel();
	function carousel()
	{
		var i;
		var x=document.getElementsByClassName("mySlides");
		for(i=0;i<x.length;i++)
		{
			x[i].style.display="none";
		}
		a++;
		if(a>x.length){a=1}
			x[a-1].style.display="block";
		setTimeout(carousel,3000);
	 }
</script>
</body>
</html>
